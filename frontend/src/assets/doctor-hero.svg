<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" fill="none">
  <defs>
    <linearGradient id="coat" x1="330" y1="200" x2="330" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6effb"/>
    </linearGradient>
    <linearGradient id="scrubs" x1="330" y1="198" x2="330" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b8bf0"/>
      <stop offset="1" stop-color="#1d5fe0"/>
    </linearGradient>
    <linearGradient id="halo" x1="180" y1="40" x2="480" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cfe1fb"/>
      <stop offset="1" stop-color="#d3f3f1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10346b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <circle cx="330" cy="206" r="172" fill="url(#halo)" opacity="0.75"/>
  <circle cx="452" cy="84" r="46" fill="#34c3d3" opacity="0.16"/>
  <circle cx="196" cy="300" r="30" fill="#2f80ed" opacity="0.12"/>
  <path d="M470 196h10v-10h8v10h10v8h-10v10h-8v-10h-10z" fill="#2f80ed" opacity="0.35"/>
  <path d="M150 170h7v-7h6v7h7v6h-7v7h-6v-7h-7z" fill="#34c3d3" opacity="0.5"/>

  <!-- doctor -->
  <g filter="url(#soft)">
    <!-- white coat -->
    <path d="M196 360c0-86 46-142 112-154l22 40 22-40c66 12 112 68 112 154z" fill="url(#coat)"/>
    <!-- scrubs under the coat -->
    <path d="M300 204l30 66 30-66c-9-4-19-6-30-6s-21 2-30 6z" fill="url(#scrubs)"/>
    <!-- lapels -->
    <path d="M300 204l30 66-16 42-40-96c8-5 17-9 26-12z" fill="#f4f8fe"/>
    <path d="M360 204l-30 66 16 42 40-96c-8-5-17-9-26-12z" fill="#f4f8fe"/>
    <path d="M300 204l30 66-16 42M360 204l-30 66 16 42" stroke="#d5e2f5" stroke-width="2" stroke-linejoin="round"/>
    <!-- pocket and pen -->
    <path d="M360 306h34" stroke="#d5e2f5" stroke-width="3" stroke-linecap="round"/>
    <rect x="380" y="288" width="6" height="22" rx="3" fill="#1d5fe0"/>
    <!-- neck -->
    <path d="M311 156h38v34c0 10-8 18-19 18s-19-8-19-18z" fill="#dba57d"/>
    <!-- head -->
    <circle cx="284" cy="126" r="8" fill="#dba57d"/>
    <circle cx="376" cy="126" r="8" fill="#dba57d"/>
    <circle cx="330" cy="120" r="46" fill="#e9b992"/>
    <!-- short hair -->
    <path d="M283 120c-3-40 18-62 49-62 30 0 50 20 46 60-4-16-15-25-31-24-18 2-38 0-50 6-8 4-12 12-14 20z" fill="#2a3042"/>
    <!-- stethoscope -->
    <path d="M304 206c-6 40 0 74 26 80 26-6 32-40 26-80" stroke="#173fa8" stroke-width="6" stroke-linecap="round"/>
    <path d="M330 286v18" stroke="#173fa8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="330" cy="318" r="13" fill="#ffffff" stroke="#173fa8" stroke-width="6"/>
    <circle cx="304" cy="205" r="5" fill="#173fa8"/>
    <circle cx="356" cy="205" r="5" fill="#173fa8"/>
  </g>

  <!-- floating cards -->
  <g filter="url(#soft)">
    <rect x="136" y="86" width="116" height="62" rx="14" fill="#ffffff"/>
    <path d="M152 120h18l8-16 12 30 10-22 6 8h30" stroke="#1d5fe0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#soft)">
    <rect x="404" y="228" width="92" height="58" rx="14" fill="#ffffff"/>
    <circle cx="430" cy="257" r="13" fill="#e3f6ec"/>
    <path d="M424 257l4.5 4.5 8-9" stroke="#0a7a43" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M452 250h30M452 264h20" stroke="#c9d6ee" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
